# Deploy = konten master PERSIS (single writer: Task Scheduler lokal via IP rumah).
# Scrape Scholar DIHAPUS dari Actions: IP datacenter umumnya diblokir Scholar, dan
# kalau sesekali lolos, angkanya melenceng dari repo master sehingga widget di
# halaman OJS jadi beda (kasus hero=500 vs sidebar=497 pada 2026-10-20/21).
# Update data kini eksklusif dari C:\Users\lynxe\alsina-widget\update.ps1 (12:30 harian).

name: Deploy alsina-scholar-widget

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
